<script>
/* Widoki.html — karty rekordów (zapytanie, klient, sprawa), zespół i dostępy, ustawienia,
   import rejestrów, pierwsza konfiguracja, obsługa zdarzeń i start aplikacji. */

function notFound() {
  return `<div class="empty"><b>Nie znaleziono rekordu</b>Mógł zostać usunięty albo należy do kancelarii, do której nie masz dostępu.<br><br><button class="btn" data-go="pulpit">Wróć na pulpit</button></div>`;
}
function backLink(route, label) { return `<button class="back" data-go="${route}">${ic('back')}${esc(label)}</button>`; }
function kv(table, r, skip) {
  skip = skip || [];
  const items = fieldsOf(table).filter((fd) => !fd.hidden && skip.indexOf(fd.k) < 0 && r[fd.k] && (!fd.model || fd.model === firmOf(r.kancelaria).model));
  if (!items.length) return '<div class="empty small">Brak danych</div>';
  return `<dl class="kv">${items.map((fd) => `<dt>${esc(fd.l)}</dt><dd>${fieldValue(table, fd, r)}</dd>`).join('')}</dl>`;
}
function fieldValue(table, fd, r) {
  const v = r[fd.k];
  switch (fd.t) {
    case 'date': return fmtDate(v, true);
    case 'datetime': return fmtDT(v);
    case 'money': return `<span class="num">${money(v)}</span>`;
    case 'check': return v ? 'tak' : '';
    case 'email': return `<a href="mailto:${attr(v)}">${esc(v)}</a>`;
    case 'tel': return `<a href="tel:${attr(String(v).replace(/\s/g, ''))}">${esc(v)}</a>`;
    case 'url': return `<a href="${attr(v)}" target="_blank" rel="noopener">${esc(/drive\.google|docs\.google/.test(v) ? 'Otwórz na Dysku' : v)} ${ic('ext').replace('<svg', '<svg width="13" height="13"')}</a>`;
    case 'user': return esc(personName(v));
    case 'users': return esc(String(v).split(',').filter(Boolean).map(personName).join(', '));
    case 'ref': { const x = byId(fd.ref, r.kancelaria, v); const route = { klienci: 'klient', sprawy: 'sprawa', zapytania: 'zapytanie' }[fd.ref]; return x ? `<a href="#" data-go="${route}/${x.kancelaria}/${x.id}">${esc(refLabel(fd.ref, x))}</a>` : '<span class="muted">—</span>'; }
    case 'textarea': return `<div class="pre">${esc(v)}</div>`;
    default: return fd.k === 'sygn_akt' ? `<span class="mono">${esc(v)}</span>` : esc(v);
  }
}
function tabsHtml(key, tabs) {
  const cur = S.tab[key] || tabs[0][0];
  return { cur, html: `<div class="tabs" role="tablist">${tabs.map(([k, l, n]) => `<button role="tab" data-tab="${k}" data-tkey="${attr(key)}" class="${k === cur ? 'on' : ''}">${esc(l)}${n !== undefined && n !== '' ? `<span class="n">${n}</span>` : ''}</button>`).join('')}</div>` };
}

/* ---------- Gmail i historia (ładowane na żądanie) ---------- */
function gmailPanel(key, emails) {
  emails = uniq(emails.filter(Boolean));
  if (!emails.length) return '<div class="empty">Brak adresu e-mail.</div>';
  const c = S.cache.gmail[key];
  if (!c) return `<div class="empty"><button class="btn" data-act="gmail" data-key="${attr(key)}" data-emails="${attr(emails.join(','))}">${ic('mail')}Pokaż korespondencję z Gmaila</button><div class="small" style="margin-top:6px">Twoja skrzynka: wiadomości od i do ${esc(emails.join(', '))}</div></div>`;
  if (c === 'loading') return '<div class="empty"><span class="spin"></span></div>';
  if (c.error) return `<div class="empty">${esc(c.error)}</div>`;
  if (!c.length) return `<div class="empty">W Twojej skrzynce nie ma wiadomości z adresem ${esc(emails.join(', '))}.</div>`;
  return c.map((m) => `<a class="mail" href="${attr(m.url)}" target="_blank" rel="noopener"><span class="s">${esc(m.subject)}${m.count > 1 ? ` <span class="muted">(${m.count})</span>` : ''}</span><span class="m">${esc(m.from)} · ${fmtDT(m.date)}</span><span class="m">${esc(m.snippet)}</span></a>`).join('');
}
async function loadGmail(key, emails) {
  S.cache.gmail[key] = 'loading'; render();
  try { S.cache.gmail[key] = await call('apiGmail', emails); } catch (e) { S.cache.gmail[key] = { error: e.message }; }
  render();
}
function histPanel(t, firm, id) {
  const key = t + ':' + firm + ':' + id, c = S.cache.hist[key];
  if (!c) {
    /* Karta zadania jest w oknie, którego render() nie odświeża — historię wstawiamy tam osobno. */
    const done = () => { render(); const box = $('.scrim .task-hist'); if (box && S.task && t === 'zadania' && S.task.firm === firm && S.task.id === id) box.innerHTML = histPanel(t, firm, id); };
    S.cache.hist[key] = 'loading';
    call('apiHistory', firm, t, id).then((h) => { S.cache.hist[key] = h; done(); }, (e) => { S.cache.hist[key] = { error: e.message }; done(); });
    return '<div class="empty"><span class="spin"></span></div>';
  }
  if (c === 'loading') return '<div class="empty"><span class="spin"></span></div>';
  if (c.error) return `<div class="empty">${esc(c.error)}</div>`;
  if (!c.length) return '<div class="empty">Brak zapisanych zmian.</div>';
  return c.map((h) => {
    let ch = '';
    if (h.akcja === 'zmiana') {
      try {
        const d = JSON.parse(h.zmiany || '{}');
        ch = Object.keys(d).map((k) => `<div class="ch">${esc(fdef(t, k).l || k)}: <s>${esc(String(d[k][0]).slice(0, 80)) || '—'}</s> → ${esc(String(d[k][1]).slice(0, 120)) || '—'}</div>`).join('');
      } catch (e) { ch = ''; }
    }
    return `<div class="hist"><b>${esc(h.akcja)}</b> · ${esc(shortName(h.kto))} · <span class="muted">${fmtDT(h.ts)}</span>${ch}</div>`;
  }).join('');
}

/* ---------- Szablony wiadomości ---------- */
function signature(firm) {
  const f = firmOf(firm), me = S.boot.me || {};
  const person = /adw|r\.\s?pr|apl/.test(me.tytul || '') ? (me.tytul + ' ' + me.imie_nazwisko).trim() : [me.imie_nazwisko, me.tytul].filter(Boolean).join('\n');
  const footer = f.podpis ? f.podpis.split('\n').filter((l) => norm(l) !== norm(person)).join('\n') : [f.nazwa_krotka, f.adres, f.telefon && 'tel. ' + f.telefon].filter(Boolean).join('\n');
  return person + '\n' + footer;
}
function offerMail(z) {
  const f = firmOf(z.kancelaria);
  const body = ['Dzień dobry,', '', 'dziękuję za opisanie sprawy. Poniżej wstępna analiza: co w tej sprawie trzeba zrobić.', '', z.analiza || '[wstępna analiza]', '',
    'Oferta:', '• zakres: ' + (z.analiza ? 'jak wyżej' : '[zakres]'), '• wynagrodzenie: ' + (z.oferta_kwota ? money(z.oferta_kwota) : '[kwota]') + (z.oferta_model ? ' (' + z.oferta_model.toLowerCase() + ')' : ''),
    '• termin: ' + (z.oferta_termin || '[termin]'), '', 'Do akceptacji oferty nic Pan/Pani nie płaci. Jeśli oferta odpowiada, wystarczy odpisać na tę wiadomość.', '',
    'Wstępna analiza nie jest opinią prawną ani pełnym sprawdzeniem dokumentów.', '', 'Z wyrazami szacunku', signature(z.kancelaria)].join('\n');
  return gmailCompose(z.email, 'Wstępna analiza sprawy i oferta – ' + f.nazwa_krotka, body);
}
function consultMail(z) {
  const f = firmOf(z.kancelaria);
  const body = ['Dzień dobry,', '', 'dziękujemy za kontakt z kancelarią. Konsultacja trwa 60 minut, w kancelarii (' + (f.adres || '') + ') albo online.', '',
    f.link_rezerwacji ? 'Dogodny termin można wybrać tutaj: ' + f.link_rezerwacji : 'Proponujemy termin: [data i godzina].', '',
    'Prosimy o zabranie lub przesłanie dokumentów dotyczących sprawy.', '', 'Z wyrazami szacunku', signature(z.kancelaria)].join('\n');
  return gmailCompose(z.email, 'Konsultacja – ' + f.nazwa_krotka, body);
}

/* ---------- Karta zapytania ---------- */
VIEWS.zapytanie = function (firm, id) {
  const z = byId('zapytania', firm, id);
  if (!z) return notFound();
  const f = firmOf(firm), w = perm().write, open = zType(z) === 'open';
  const hits = conflictHits(z.nazwa, z).filter((h) => !(h.r.id === z.klient_id && h.role === 'Klient'));
  const offerStatus = (dict(firm, 'status_zapytania').find((d) => /^Oferta/i.test(d.v)) || {}).v;
  const statuses = dict(firm, 'status_zapytania');
  const acts = [];
  if (w && open) {
    if (f.model === 'analiza') {
      if (z.email) acts.push(`<a class="btn primary" href="${attr(offerMail(z))}" target="_blank" rel="noopener">${ic('send')}Napisz analizę i ofertę</a>`);
      if (offerStatus && z.status !== offerStatus && !z.odpowiedz) acts.push(`<button class="btn" data-act="zap-status" data-v="${attr(offerStatus)}">${ic('check')}Oferta wysłana</button>`);
    } else if (z.email) acts.push(`<a class="btn primary" href="${attr(consultMail(z))}" target="_blank" rel="noopener">${ic('send')}Zaproś na konsultację</a>`);
    acts.push(`<button class="btn" data-act="zap-accept">${ic('briefcase')}Przyjmij — załóż sprawę</button>`);
    acts.push(`<button class="btn ghost" data-act="zap-close">Zamknij bez zlecenia</button>`);
  }
  if (w) acts.push(`<button class="btn ghost" data-act="edit" data-t="zapytania" data-firm="${firm}" data-id="${id}">${ic('edit')}Edytuj</button>`);
  const kl = byId('klienci', firm, z.klient_id), sp = byId('sprawy', firm, z.sprawa_id);
  const tb = tabsHtml('zap:' + firm + ':' + id, [['opis', 'Sprawa'], ['mail', 'E-maile'], ['hist', 'Historia']]);
  const body = tb.cur === 'mail' ? `<section class="panel">${gmailPanel('z:' + firm + ':' + id, [z.email])}</section>`
    : tb.cur === 'hist' ? `<section class="panel">${histPanel('zapytania', firm, id)}</section>`
    : `<div class="grid-2"><div class="stack">
        <section class="panel"><div class="panel-h"><h2>Opis od klienta</h2>${z.pilne ? chip('bad', 'pilne terminy') : ''}</div><div class="panel-b pre">${esc(z.opis) || '<span class="muted">brak opisu</span>'}</div></section>
        <section class="panel"><div class="panel-h"><h2>${f.model === 'analiza' ? 'Wstępna analiza i oferta' : 'Konsultacja i oferta'}</h2>${w ? `<button class="btn sm" data-act="edit" data-t="zapytania" data-firm="${firm}" data-id="${id}">Uzupełnij</button>` : ''}</div>
          <div class="panel-b">${kv('zapytania', z, ['nazwa', 'email', 'telefon', 'kontakt', 'opis', 'status', 'kanal', 'kategoria', 'data_wplywu', 'pilne', 'opiekun', 'klient_id', 'sprawa_id', 'folder', 'strona_www', 'kw', 'konflikt'])}</div></section>
      </div><div class="stack">
        <section class="panel"><div class="panel-h"><h2>Kontakt</h2></div><div class="panel-b">${kv('zapytania', z, ['nazwa', 'opis', 'status', 'analiza', 'oferta_kwota', 'oferta_model', 'oferta_termin', 'odpowiedz', 'przypomnienie', 'powod', 'termin_odpowiedzi', 'konflikt', 'konsultacja'])}</div></section>
        <section class="panel"><div class="panel-h"><h2>Konflikt interesów</h2>${chip(z.konflikt === 'Brak konfliktu' ? 'ok' : z.konflikt === 'Konflikt – odmowa' ? 'bad' : 'warn', esc(z.konflikt || 'Nie sprawdzono'))}</div>
          ${hits.length ? `<ul class="rows">${hits.slice(0, 8).map((h) => `<li data-go="${h.go}">${chip(h.cls, h.role)}${firmTag(h.r.kancelaria)}<div class="main-txt"><b>${esc(h.label)}</b><span>${esc(h.sub)}</span></div></li>`).join('')}</ul>`
            : `<div class="panel-b small muted">W bazie nie ma klienta, strony przeciwnej ani innego zapytania o nazwie „${esc(z.nazwa)}”.</div>`}
          ${w && z.konflikt !== 'Brak konfliktu' ? `<div class="panel-b" style="border-top:1px solid var(--line)"><button class="btn sm" data-act="zap-nokonflikt">${ic('check')}Sprawdzone: brak konfliktu</button> <button class="btn sm ghost" data-go="konflikt" data-act="conflict-q" data-q="${attr(z.nazwa)}">Szukaj szerzej</button></div>` : ''}
        </section>
      </div></div>`;
  return `${backLink('zapytania', 'Zapytania')}
    <div class="rec-head"><div class="t"><h1>${esc(z.nazwa)}</h1>
      <div class="meta">${firmTag(firm)}${w && statuses.length ? `<select class="inp mini" data-act-change="zap-status-sel" aria-label="Status">${statuses.map((d) => `<option${d.v === z.status ? ' selected' : ''}>${esc(d.v)}</option>`).join('')}</select>` : statusChip('zapytania', z)}
        ${slaChip(z)}<span>${esc(z.kategoria || '')}</span><span>wpłynęło ${fmtDT(z.data_wplywu)} · ${esc(z.kanal || '')}</span>
        ${z.opiekun ? `<span>prowadzi ${esc(shortName(z.opiekun))}</span>` : ''}
        ${z.folder ? `<a href="${attr(z.folder)}" target="_blank" rel="noopener">${ic('folder').replace('<svg', '<svg width="14" height="14"')} folder zgłoszenia</a>` : ''}
        ${kl ? `<a href="#" data-go="klient/${firm}/${kl.id}">klient: ${esc(kl.nazwa)}</a>` : ''}${sp ? `<a href="#" data-go="sprawa/${firm}/${sp.id}">sprawa ${esc(caseNo(sp))}</a>` : ''}</div></div>
      <div class="actions">${acts.join('')}</div></div>${tb.html}${body}`;
};

function acceptModal(z) {
  const firm = z.kancelaria, team = teamFor(firm);
  const opt = (list, v) => list.map((x) => `<option${x === v ? ' selected' : ''}>${esc(x)}</option>`).join('');
  openModal(`<form class="modal" id="acc-form"><div class="modal-h"><h2>Przyjęcie sprawy: ${esc(z.nazwa)}</h2><button type="button" class="icon-btn" data-act="close">${ic('x')}</button></div>
    <div class="modal-b"><div class="form">
      <div class="fld wide"><label for="a-tytul">Przedmiot sprawy</label><input class="inp" id="a-tytul" name="tytul" value="${attr(z.kategoria || '')}" required></div>
      <div class="fld"><label for="a-numer">Nr teczki</label><input class="inp mono" id="a-numer" name="numer" placeholder="puste = kolejny numer"><span class="help">Puste: kolejny numer wspólnej Listy Spraw. „P”: seria P (bez teczki).</span></div>
      <div class="fld"><label for="a-prow">Prowadzący</label><select class="inp" id="a-prow" name="prowadzacy">${team.map((m) => `<option value="${attr(m.email)}"${m.email === (z.opiekun || S.boot.email) ? ' selected' : ''}>${esc(m.imie_nazwisko)}</option>`).join('')}</select></div>
      <div class="fld"><label for="a-kat">Kategoria</label><select class="inp" id="a-kat" name="kategoria"><option></option>${opt(dict(firm, 'kategoria').map((d) => d.v), z.kategoria)}</select></div>
      <div class="fld"><label for="a-rodzaj">Rodzaj</label><select class="inp" id="a-rodzaj" name="rodzaj"><option></option>${opt(dict(firm, 'rodzaj_sprawy').map((d) => d.v), '')}</select></div>
      <div class="fld wide"><label for="a-sp">Strona przeciwna / uczestnicy</label><input class="inp" id="a-sp" name="strona_przeciwna"><span class="help">Po tym polu działa sprawdzanie konfliktu interesów.</span></div>
      <div class="fld"><label for="a-model">Model wynagrodzenia</label><select class="inp" id="a-model" name="wyn_model"><option></option>${opt(dict(firm, 'model_wynagrodzenia').map((d) => d.v), z.oferta_model)}</select></div>
      <div class="fld"><label for="a-kwota">Wynagrodzenie (zł)</label><input class="inp" id="a-kwota" name="wynagrodzenie" type="number" step="0.01" value="${attr(z.oferta_kwota || '')}"></div>
      <div class="fld wide"><label class="check"><input type="checkbox" name="folder" checked> Załóż folder sprawy na Dysku („(nr) Klient - przedmiot” z podfolderem „0. Umowa i rozliczenia z Klientem”)</label></div>
    </div><p class="note">${z.klient_id ? 'Sprawa zostanie przypięta do istniejącego klienta.' : 'Powstanie też karta klienta z danymi z zapytania.'} Zapytanie dostanie status „przyjęte”.</p></div>
    <div class="modal-f"><button type="button" class="btn" data-act="close">Anuluj</button><button class="btn primary" type="submit">Załóż sprawę</button></div></form>`);
}
function closeZapModal(z) {
  const lost = dict(z.kancelaria, 'status_zapytania').filter((d) => d.t === 'lost');
  openModal(`<form class="modal narrow" id="zclose-form"><div class="modal-h"><h2>Zamknij zapytanie</h2></div><div class="modal-b"><div class="form">
    <div class="fld wide"><label for="zc-st">Wynik</label><select class="inp" id="zc-st" name="status">${lost.map((d) => `<option>${esc(d.v)}</option>`).join('')}</select></div>
    <div class="fld wide"><label for="zc-p">Powód (do statystyk)</label><input class="inp" id="zc-p" name="powod" placeholder="np. za drogo, wybrał innego pełnomocnika, wartość sporu poniżej minimum"></div></div></div>
    <div class="modal-f"><button type="button" class="btn" data-act="close">Anuluj</button><button class="btn primary" type="submit">Zamknij zapytanie</button></div></form>`);
}

/* ---------- Karta klienta ---------- */
VIEWS.klient = function (firm, id) {
  const k = byId('klienci', firm, id);
  if (!k) return notFound();
  const w = perm().write;
  const sp = S.data.sprawy.filter((s) => s.kancelaria === firm && s.klient_id === id);
  const zp = S.data.zapytania.filter((z) => z.kancelaria === firm && (z.klient_id === id || (k.email && z.email && z.email.toLowerCase() === k.email.toLowerCase())));
  const um = S.data.umowy.filter((u) => u.kancelaria === firm && u.klient_id === id);
  const tb = tabsHtml('kl:' + firm + ':' + id, [['sprawy', 'Sprawy', sp.length], ['zap', 'Zapytania', zp.length], ['umowy', 'Umowy', um.length], ['mail', 'E-maile'], ['hist', 'Historia']]);
  const pre = attr(JSON.stringify({ klient_id: id }));
  let body = '';
  if (tb.cur === 'sprawy') body = `<section class="panel">${tableHtml('kl-sp', [
    { k: 'numer', l: 'Nr', v: (s) => `<span class="teczka">${esc(caseNo(s) || '—')}</span>` }, { k: 'tytul', l: 'Sprawa', cls: 'wrap', v: (s) => `<b>${esc(s.tytul)}</b><span class="sub">${esc(s.sygn_akt)}</span>` },
    { k: 'status', l: 'Status', v: (s) => statusChip('sprawy', s) }, { k: 'prowadzacy', l: 'Prowadzi', v: (s) => esc(shortName(s.prowadzacy)) }], sp, (s) => 'sprawa/' + firm + '/' + s.id, { empty: 'Klient nie ma spraw' })}</section>`;
  if (tb.cur === 'zap') body = `<section class="panel">${zp.length ? `<ul class="rows">${zp.map((z) => `<li data-go="zapytanie/${firm}/${z.id}"><div class="main-txt"><b>${esc(z.kategoria || z.nazwa)}</b><span>${fmtDT(z.data_wplywu)} · ${esc((z.opis || '').slice(0, 100))}</span></div>${statusChip('zapytania', z)}</li>`).join('')}</ul>` : '<div class="empty">Brak zapytań</div>'}</section>`;
  if (tb.cur === 'umowy') body = `<section class="panel">${tableHtml('kl-um', [{ k: 'nr', l: 'L.p.', v: (u) => `<span class="mono">${esc(u.nr)}</span>` }, { k: 'data_zawarcia', l: 'Zawarta', v: (u) => fmtDate(u.data_zawarcia) }, { k: 'przedmiot', l: 'Przedmiot', cls: 'wrap' }, { k: 'rozliczone', l: 'Rozliczone' }], um, (u) => 'edit/umowy/' + firm + ':' + u.id, { empty: 'Brak umów' })}</section>`;
  if (tb.cur === 'mail') body = `<section class="panel">${gmailPanel('k:' + firm + ':' + id, [k.email])}</section>`;
  if (tb.cur === 'hist') body = `<section class="panel">${histPanel('klienci', firm, id)}</section>`;
  return `${backLink('klienci', 'Klienci')}
    <div class="rec-head"><div class="t"><h1>${esc(k.nazwa)}</h1><div class="meta">${firmTag(firm)}<span>${esc(k.typ)}</span>
      ${k.email ? `<a href="mailto:${attr(k.email)}">${esc(k.email)}</a>` : ''}${k.telefon ? `<a href="tel:${attr(k.telefon.replace(/\s/g, ''))}">${esc(k.telefon)}</a>` : ''}
      ${k.opiekun ? `<span>opiekun: ${esc(shortName(k.opiekun))}</span>` : ''}</div></div>
      <div class="actions">${w ? `<button class="btn primary" data-act="new" data-t="sprawy" data-firm="${firm}" data-pre="${pre}">${ic('plus')}Nowa sprawa</button>
        <button class="btn" data-act="new" data-t="umowy" data-firm="${firm}" data-pre="${pre}">Umowa</button>` : ''}
        ${k.email ? `<a class="btn" href="${attr(gmailCompose(k.email, '', 'Dzień dobry,\n\n\n\nZ wyrazami szacunku\n' + signature(firm)))}" target="_blank" rel="noopener">${ic('mail')}Napisz</a>` : ''}
        <button class="btn ghost" data-act="conflict-q" data-q="${attr(k.nazwa)}">${ic('scale')}Konflikt</button>
        ${w ? `<button class="btn ghost" data-act="edit" data-t="klienci" data-firm="${firm}" data-id="${id}">${ic('edit')}Edytuj</button>` : ''}</div></div>
    <div class="grid-2" style="margin-bottom:16px"><section class="panel"><div class="panel-h"><h2>Dane klienta</h2></div><div class="panel-b">${kv('klienci', k, ['nazwa', 'notatki'])}</div></section>
      <section class="panel"><div class="panel-h"><h2>Notatki</h2></div><div class="panel-b pre">${esc(k.notatki) || '<span class="muted">brak</span>'}</div></section></div>
    ${tb.html}${body}`;
};

/* ---------- Karta sprawy ---------- */
VIEWS.sprawa = function (firm, id) {
  const s = byId('sprawy', firm, id);
  if (!s) return notFound();
  const w = perm().write, k = byId('klienci', firm, s.klient_id);
  const of = (t) => S.data[t].filter((r) => r.kancelaria === firm && r.sprawa_id === id);

const TASK_CHIP = { 'Nowe': 'info', 'W toku': '', 'Do sprawdzenia': 'warn', 'Zrobione': 'ok', 'Anulowane': '' };

  if (t.termin === today()) return chip('warn', 'dziś' + h);
  if (t.termin === SH.addDays(today(), 1)) return chip('', 'jutro' + h);
  return chip('', fmtDate(t.termin, true) + h);
}

  return `<li class="task${isOpenTask(t) ? '' : ' done'}" data-go="zadanie/${t.kancelaria}/${t.id}">
    ${canTick ? `<button class="tick" data-act="task-tick" data-firm="${t.kancelaria}" data-id="${t.id}" title="${goesToReview(t) ? 'Oddaj do sprawdzenia' : 'Zrobione'}" aria-label="${goesToReview(t) ? 'Oddaj do sprawdzenia' : 'Oznacz jako zrobione'}">${ic('check')}</button>`

function groupByDue(list) {
  const g = [['Zaległe', (t) => t.termin && t.termin < today()], ['Dziś', (t) => t.termin === today()], ['Jutro', (t) => t.termin === SH.addDays(today(), 1)],
    ['Najbliższe 7 dni', (t) => t.termin && t.termin > SH.addDays(today(), 1) && t.termin <= SH.addDays(today(), 7)], ['Później', (t) => t.termin > SH.addDays(today(), 7)], ['Bez terminu', (t) => !t.termin]];
  const used = new Set();
  return g.map(([l, test]) => { const items = list.filter((t) => !used.has(t) && test(t)).sort((a, b) => (taskDueKey(a) < taskDueKey(b) ? -1 : 1)); items.forEach((t) => used.add(t)); return [l, items]; }).filter((x) => x[1].length);
}

}

/* Szybkie dodawanie jedną linijką: „Wyślij pozew #593 @Julia pt !”. */
const QUICK_WD = { nd: 0, ndz: 0, niedz: 0, pn: 1, pon: 1, wt: 2, sr: 3, cz: 4, czw: 4, pt: 5, pia: 5, piat: 5, sb: 6, sob: 6 };
function quickDate(w) {
  const n = norm(w).replace(/[.,]$/, '');
  if (n === 'dzis' || n === 'dzisiaj') return today();
  if (n === 'jutro') return SH.addDays(today(), 1);
  if (n === 'pojutrze') return SH.addDays(today(), 2);
  if (Object.prototype.hasOwnProperty.call(QUICK_WD, n)) { const cur = new Date(SH.parse(today())).getUTCDay(); return SH.addDays(today(), (QUICK_WD[n] - cur + 7) % 7); }
  const m = /^(\d{1,2})\.(\d{1,2})(?:\.(\d{2}|\d{4}))?$/.exec(n);
  if (!m) return '';
  const y = m[3] ? (m[3].length === 2 ? '20' + m[3] : m[3]) : today().slice(0, 4);
  let d = y + '-' + SH.pad(+m[2]) + '-' + SH.pad(+m[1]);
  if (!m[3] && d < today()) d = (+y + 1) + d.slice(4);
  return isNaN(SH.parse(d)) || SH.ymdOf(SH.parse(d)) !== d ? '' : d;
}
function parseQuick(text) {
  const out = { pilne: '', termin: '', sprawa: null, who: null, errors: [] }, title = [];
  /* Datę bierzemy tylko z końcówki („… #593 @Julia pt !”), żeby „cz. 2”, „pt. Kowalski” czy „1.5 ha” zostały w tytule.
     „dziś”, „jutro” i „pojutrze” są jednoznaczne i działają w każdym miejscu. */
  const words = String(text || '').trim().split(/\s+/).filter(Boolean);
  let tail = words.length;
  /* Słowo z kropką („pt.”) i skrót wielkimi literami („SR” = sąd rejonowy) to nie dzień tygodnia. */
  const dateWord = (w) => !/\.$/.test(w) && !/^[A-ZĄĆĘŁŃÓŚŹŻ]{2,}$/.test(w) && quickDate(w);
  while (tail > 0 && (/^[#@!]/.test(words[tail - 1]) || /^do$/i.test(words[tail - 1]) || (dateWord(words[tail - 1]) && !/^(z|ze|od|dnia)$/i.test(words[tail - 2] || '')))) tail--;
  words.forEach((w, i) => {
    let m;
    if ((m = /^#(P?\d{1,4})$/i.exec(w))) {
      const nr = m[1].toUpperCase(), cands = S.data.sprawy.filter((s) => String(s.numer).toUpperCase() === nr);
      out.sprawa = cands.find((s) => S.firm === 'all' || s.kancelaria === S.firm) || cands[0] || null;
      if (!out.sprawa) out.errors.push('nie ma sprawy #' + nr);
      return;
    }
    if ((m = /^@(.+)$/.exec(w))) {
      /* @Julia, @Bednarek, @Maciej.B — przy dwóch pasujących osobach prosimy o doprecyzowanie, zamiast zgadywać. */
      const q = norm(m[1]).replace(/[.,;:]+$/, ''), pieces = q.split(/[._]+/).filter(Boolean);
      if (q === 'ja') { out.who = member(me()); return; }
      const parts = (x) => norm(x.imie_nazwisko).split(/[\s-]+/);
      const cands = (S.boot.team || []).filter((x) => x.aktywny !== 'nie' && pieces.length && pieces.every((pc) => parts(x).some((p) => p.indexOf(pc) === 0)));
      const exact = cands.filter((x) => parts(x).indexOf(q) >= 0);
      out.who = cands.length === 1 ? cands[0] : exact.length === 1 ? exact[0] : null;
      if (!out.who) out.errors.push(cands.length > 1 ? '@' + m[1] + ' pasuje do: ' + cands.map((x) => x.imie_nazwisko).join(', ') + ' — dopisz nazwisko (np. @' + parts(cands[0]).slice(-1)[0] + ')' : 'nie znam osoby @' + m[1]);
      return;
    }
    if (w === '!') { out.pilne = 'tak'; return; }
    const d = (i >= tail && dateWord(w)) || /^(dzi[sś](iaj)?|jutro|pojutrze)$/i.test(w) ? quickDate(w) : '';
    if (d) { out.termin = d; if (title.length && /^do$/i.test(title[title.length - 1])) title.pop(); return; }
    title.push(w);
  });
  out.tytul = title.join(' ');
  out.przypisane = out.who ? out.who.email : me();
  const firmsOf = (e) => String((member(e) || {}).kancelarie || '').split(',').filter((k) => myFirms().indexOf(k) >= 0);
  const af = firmsOf(out.przypisane);
  out.firm = out.sprawa ? out.sprawa.kancelaria : S.firm !== 'all' && af.indexOf(S.firm) >= 0 ? S.firm : af.length === 1 ? af[0] : af.indexOf(defaultFirm()) >= 0 ? defaultFirm() : af[0] || defaultFirm();
  if (af.indexOf(out.firm) < 0) out.errors.push(shortName(out.przypisane) + ' nie ma dostępu do ' + out.firm);
  if (!out.tytul) out.errors.push('wpisz, co zrobić');
  return out;
}

  const hist = !!(S.task && S.task.firm === firm && S.task.id === id && S.task.hist);
  S.task = { firm, id, panel: panel || '', hist };
  const sc = $('.scrim');

}

const ROLE_WRITE = (r) => !!((S.boot.schema.roles[r] || {}).write);
function mailWarn(v) { if (v === 'blad') toast('Nie udało się wysłać powiadomienia e-mail. Daj znać tej osobie inną drogą.', true); }
async function taskDo(el) {
  const st = S.task || {}, a = el.dataset.a, t = byId('zadania', st.firm, st.id);
  if (!t) return;
  /* Przyciski z panelem tylko go otwierają; akcję wykonuje wyłącznie „Zatwierdź” w panelu. */
  if (el.dataset.panel) { if (st.panel !== a) { st.panel = a; openTaskModal(st.firm, st.id, a); } const n = $('#tk-note'); if (n) n.focus(); return; }
  const p = { _ver: t.zmieniono };
  if (a === 'komentarz') { p.komentarz = ($('#tk-new') || {}).value || ''; if (!p.komentarz.trim()) { toast('Wpisz treść komentarza.', true); return; } }
  else p.komentarz = el.dataset.goNow && st.panel === a ? ($('#tk-note') || {}).value || '' : '';
  if (a === 'przekaz') p.do = ($('#tk-to') || {}).value || '';
  if (a === 'przesun') p.termin = ($('#tk-date') || {}).value || '';
  await busy(el, async () => {
    const r = await call('apiTask', st.firm, st.id, a, p);
    upsert('zadania', r.zadanie);
    if (r.komentarz) upsert('komentarze', r.komentarz);
    mailWarn(r.powiadomiono);
    toast({ przyjmij: 'Przyjęto zadanie', zrobione: r.zadanie.status === 'Do sprawdzenia' ? 'Oddano do sprawdzenia' : 'Zrobione', zatwierdz: 'Zatwierdzono', zwroc: 'Zwrócono do poprawy', przekaz: 'Przekazano: ' + personName(r.zadanie.przypisane), odrzuc: 'Odrzucono — wraca do zlecającego', anuluj: 'Anulowano zadanie', otworz: 'Otwarto ponownie', przesun: 'Zmieniono termin', komentarz: 'Dodano komentarz' }[a] || 'Zapisano');
    st.panel = '';
    render();
    if ($('.scrim')) openTaskModal(st.firm, st.id);
  });
}

const KAT_GUESS = {
  KR: [[/rozw|separac/, 'Rozwód i separacja'], [/alimen/, 'Alimenty'], [/podzia|rozdzielno|majat/, 'Podział majątku / rozdzielność'], [/kontakt/, 'Kontakty z dzieckiem'], [/wladz|piecz|miejsc|istotn/, 'Władza rodzicielska / miejsce pobytu'],
    [/przemoc|niebiesk/, 'Przemoc domowa'], [/karn|zne[cs]|pobic|nek|wykrocz|oskarz|stalk/, 'Sprawy karne i wykroczenia'], [/spad|zachow/, 'Spadki i zachowek'], [/darowiz/, 'Darowizny'], [/przysposob/, 'Przysposobienie'], [/zaplat|cywil|odszkod/, 'Zapłata / cywilne'], [/mediac/, 'Mediacja']],
  KN: [[/przesyl|slup|bezumown|linia|gazociag|wodociag/, 'Przesył i bezumowne korzystanie'], [/drog|sluzebn/, 'Droga konieczna i służebności'], [/zasiedz|ksieg|kw\b|granic|uzytkowan/, 'Księgi wieczyste i stan prawny'],
    [/\bwz\b|warunk|plan|mpzp|wsa|nsa/, 'Warunki zabudowy i planowanie'], [/najem|najm|eksmis|czynsz/, 'Najem i eksmisja'], [/budow|wykonaw|samowol|pinb/, 'Proces budowlany i samowole'],
    [/wspolwlas|dzial|spadk|zachow/, 'Współwłasność, spadki, podziały'], [/deweloper|rekojm|wad/, 'Spory z deweloperem'], [/roln|oze|kowr|dzierzaw|fotowolt/, 'Grunty rolne i OZE'], [/wywlaszcz|zrid|specustaw/, 'Wywłaszczenia i odszkodowania'],
    [/audyt|zakup|due dilig/, 'Sprawdzenie przed zakupem (audyt)'], [/umow|sprzeda|przedwstep|transakc/, 'Transakcje i umowy'], [/stala obslug|obsluga prawn/, 'Obsługa podmiotów (B2B)']]
};
function guessKat(firm, text) { const t = norm(text); const hit = (KAT_GUESS[firm] || []).find(([re]) => re.test(t)); return hit && dict(firm, 'kategoria').some((d) => d.v === hit[1]) ? hit[1] : ''; }
function guessMember(name) {
  const parts = norm(name).split(/[\s.,]+/).filter((p) => p.length > 2);
  if (!parts.length) return '';
  const m = (S.boot.team || []).find((x) => parts.some((p) => norm(x.imie_nazwisko).split(/\s+/).indexOf(p) >= 0 && p === parts[parts.length - 1]))
    || (S.boot.team || []).find((x) => parts.every((p) => norm(x.imie_nazwisko).indexOf(p) >= 0));
  return m ? m.email : '';
}
function guessModel(txt) {
  const t = norm(txt);
  if (!t) return ['', ''];
  const h = /(\d+(?:[.,]\d+)?)\s*(?:h|godz)/.exec(t);
  if (/success/.test(t) && /rycz/.test(t)) return ['Ryczałt + success fee', ''];
  if (/success|premi/.test(t)) return ['Success fee', ''];
  if (h) return ['Pakiet godzin', h[1].replace(',', '.')];
  if (/godzin/.test(t)) return ['Godzinowe', ''];
  if (/rycz/.test(t)) return ['Ryczałt', ''];
  if (/etap/.test(t)) return ['Etapowe', ''];
  if (/abonam|stal/.test(t)) return ['Stała obsługa (abonament)', ''];
  return ['', ''];
}
const isGrey = (c) => { const m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/.exec(c || ''); if (!m) return false; const [r, g, b] = m.slice(1).map((x) => parseInt(x, 16)); return Math.max(r, g, b) - Math.min(r, g, b) < 18 && r < 240; };

function srcId(kind) { const l = ($('#imp-' + kind + '-link') || {}).value; const s = ($('#imp-' + kind) || {}).value; return (l && l.trim()) || s || ''; }

/* Mapowanie po analizie: kancelaria i osoba dla opiekunów, status dla kolorów/statusów. */
function importMapping(kind) {

  const userOpts = (firm, v) => `<option value="">— (ja + notatka)</option>` + (S.boot.team || []).map((m) => `<option value="${attr(m.email)}"${m.email === v ? ' selected' : ''}>${esc(m.imie_nazwisko)}</option>`).join('');
  const statusOpts = (v, extra) => (extra || []).concat(dict(firms[0], 'status_sprawy').map((d) => d.v)).map((x) => `<option${x === v ? ' selected' : ''}>${esc(x)}</option>`).join('');

    html += `<h3 style="margin:14px 0 8px">Opiekunowie → kancelaria i osoba</h3><div class="table-wrap"><table class="t"><thead><tr><th class="nosort">W pliku</th><th class="nosort">Wierszy</th><th class="nosort">Kancelaria</th><th class="nosort">Osoba w CRM</th></tr></thead><tbody>
      ${Object.keys(st.op).map((o) => `<tr><td>${esc(o || '(pusty)')}</td><td class="num">${st.opCount[o]}</td><td><select class="inp mini" data-imp="${kind}" data-map="opFirm" data-k="${attr(o)}">${firmOpts(st.op[o].firm)}</select></td><td><select class="inp mini" data-imp="${kind}" data-map="opUser" data-k="${attr(o)}">${userOpts(st.op[o].firm, st.op[o].user)}</select></td></tr>`).join('')}</tbody></table></div>`;
  }
  if (kind === 'lista') {
    html += `<h3 style="margin:14px 0 8px">Kolor komórki „Klient” → status sprawy</h3><p class="small muted">W pliku nie ma legendy kolorów — przypisz je sam. Domyślnie szare = zakończone.</p><div class="table-wrap"><table class="t"><thead><tr><th class="nosort">Kolor</th><th class="nosort">Wierszy</th><th class="nosort">Status</th></tr></thead><tbody>
      ${Object.keys(st.colors).map((c) => `<tr><td><span style="display:inline-block;width:42px;height:18px;border-radius:4px;border:1px solid var(--line-strong);background:${attr(c)}"></span> <span class="mono small">${esc(c)}</span></td><td class="num">${st.colorCount[c]}</td><td><select class="inp mini" data-imp="lista" data-map="colors" data-k="${attr(c)}">${statusOpts(st.colors[c])}</select></td></tr>`).join('')}</tbody></table></div>`;
  }
  if (kind === 'notatki') {
    html += `<h3 style="margin:14px 0 8px">Status notatki → rekord w CRM</h3><div class="table-wrap"><table class="t"><thead><tr><th class="nosort">Status</th><th class="nosort">Plików</th><th class="nosort">Import jako</th></tr></thead><tbody>
      ${Object.keys(st.stat).map((s) => `<tr><td>${esc(s || '(pusty)')}</td><td class="num">${st.statCount[s]}</td><td><select class="inp mini" data-imp="notatki" data-map="stat" data-k="${attr(s)}">${statusOpts(st.stat[s], ['Zapytanie', 'pomiń'])}</select></td></tr>`).join('')}</tbody></table></div>`;
  }
  if (kind === 'umowy') {
    html += `<div class="form" style="margin-top:12px"><div class="fld"><label for="imp-um-firm">Kancelaria domyślna</label><select class="inp" id="imp-um-firm" data-imp="umowy" data-map="firm">${firms.map((k) => `<option value="${k}"${k === st.firm ? ' selected' : ''}>${esc(firmOf(k).nazwa_krotka)}</option>`).join('')}</select></div>
      <div class="fld"><label class="check" style="margin-top:20px"><input type="checkbox" data-imp="umowy" data-map="byClient" ${st.byClient ? 'checked' : ''}> umowa do kancelarii klienta, jeśli klient jest już w bazie</label></div></div>`;
  }

function prepImport(kind, res) {
  const st = { file: res.file || res.folder, rows: res.rows };
  if (kind === 'lista' || kind === 'notatki') {
    st.op = {}; st.opCount = {};
    res.rows.forEach((r) => { const o = r.opiekun || ''; st.opCount[o] = (st.opCount[o] || 0) + 1; if (!st.op[o]) { const u = guessMember(o); st.op[o] = { firm: kind === 'notatki' ? 'KN' : 'KR', user: u }; } });
    Object.keys(st.op).forEach((o) => { if (myFirms().indexOf(st.op[o].firm) < 0) st.op[o].firm = myFirms()[0]; });
  }
  if (kind === 'lista') {
    st.colors = {}; st.colorCount = {};
    res.rows.forEach((r) => { st.colorCount[r.kolor] = (st.colorCount[r.kolor] || 0) + 1; st.colors[r.kolor] = isGrey(r.kolor) ? 'Zakończona' : 'Aktywna'; });
  }
  if (kind === 'notatki') {
    st.stat = {}; st.statCount = {};
    res.rows.forEach((r) => { const s = norm(r.status).trim(); st.statCount[s] = (st.statCount[s] || 0) + 1; st.stat[s] = /lead|ofert/.test(s) ? 'Zapytanie' : /zakoncz|zamkn|rozlicz/.test(s) ? 'Zakończona' : 'Aktywna'; });
  }
  if (kind === 'umowy') { st.firm = myFirms().indexOf('KR') >= 0 ? 'KR' : myFirms()[0]; st.byClient = true; }
  IMP[kind] = st;
}
function buildImportItems(kind) {
  const st = IMP[kind], out = [];
  if (kind === 'lista') st.rows.forEach((r) => {
    const m = st.op[r.opiekun || ''] || {}; if (!m.firm) return;
    out.push({ kancelaria: m.firm, table: 'sprawy', klient: { nazwa: r.klient, email: r.email, telefon: r.telefon, zrodlo: '' }, rec: {
      numer: r.numer, tytul: r.rodzaj || 'Sprawa z Listy Spraw', kategoria: guessKat(m.firm, r.rodzaj), sygn_akt: r.sygn, status: st.colors[r.kolor] || 'Aktywna',
      prowadzacy: m.user || '', notatki: r.opiekun && !m.user ? 'Opiekun w Liście Spraw: ' + r.opiekun : '', zrodlo_id: 'lista:' + (r.numer || r.klient) } });
  });
  if (kind === 'umowy') {
    const byName = {};
    S.data.klienci.forEach((k) => { byName[norm(k.nazwa)] = k.kancelaria; });
    st.rows.forEach((r) => {
      const firm = (st.byClient && byName[norm(r.klient)]) || st.firm;
      const [model, godz] = guessModel(r.zaliczka);
      const roz = dict(firm, 'rozliczone').map((d) => d.v);

        rozliczone: roz.find((v) => norm(v) === rz) || (rz ? (/dopl|kwot/.test(rz) ? 'do dopłaty' : 'nie') : 'nie'),
        notatki: [r.zaliczka && !model ? 'Zaliczka/rozliczenie: ' + r.zaliczka : '', r.rozliczone && !roz.some((v) => norm(v) === rz) ? 'Rozliczone (w rejestrze): ' + r.rozliczone : ''].filter(Boolean).join('\n'),
        zrodlo_id: 'umowy:' + (r.nr || r.klient + r.data) } });
    });
  }
  if (kind === 'notatki') st.rows.forEach((r) => {
    const m = st.op[r.opiekun || ''] || {}, as = st.stat[norm(r.status).trim()];
    if (!m.firm || as === 'pomiń') return;
    const note = [r.etap && 'Etap: ' + r.etap, r.rozliczenie && 'Rozliczenie: ' + r.rozliczenie, r.ostatni_ruch && 'Ostatni ruch: ' + r.ostatni_ruch, 'Notatka Obsidian: ' + r.url, r.tresc].filter(Boolean).join('\n');
    if (as === 'Zapytanie') {
      out.push({ kancelaria: m.firm, table: 'zapytania', klient: null, rec: { nazwa: r.klient || r.plik, data_wplywu: (r.ostatni_ruch || today()) + 'T09:00', kanal: 'Inne',
        status: /ofert/.test(norm(r.etap)) ? ((dict(m.firm, 'status_zapytania').find((d) => /^Oferta/.test(d.v)) || {}).v || '') : ((dict(m.firm, 'status_zapytania')[1] || {}).v || ''),
        kategoria: guessKat(m.firm, r.typ + ' ' + r.przedmiot), opis: [r.przedmiot, note].filter(Boolean).join('\n\n'), opiekun: m.user || '', zrodlo_id: 'md:' + r.id } });
      return;
    }
    const [model] = guessModel(r.rozliczenie);
    const etap = dict(m.firm, 'etap_sprawy').find((d) => norm(d.v) === norm(r.etap));
    out.push({ kancelaria: m.firm, table: 'sprawy', klient: r.klient ? { nazwa: r.klient } : null, termin: r.termin ? { data: r.termin, opis: r.termin_opis || 'Termin (z notatki)' } : null, rec: {
      numer: r.numer, tytul: r.przedmiot || r.plik, kategoria: guessKat(m.firm, r.typ + ' ' + r.przedmiot), status: as, etap: etap ? etap.v : '', nastepny_krok: etap ? '' : r.etap,
      sygn_akt: r.sygnatura, prowadzacy: m.user || '', wyn_model: model, notatki: note.slice(0, 5000), zrodlo_id: 'md:' + r.id } });
  });
  return out;
}

function calStripKey(title) { return norm(String(title).replace(/[(\[][^()\[\]]{0,25}[)\]]/g, ' ')).replace(/\s+/g, ' ').trim(); }
/* Duplikaty scalamy tylko wtedy, gdy różnią się samym znacznikiem „(zrobione)” — numer teczki i „(ODWOŁANA)” zostają w kluczu. */
function calDedupKey(title) {
  return norm(title).replace(/[(\[]\s*(?:zrobion|wykonan|zrob\.)[^)\]]*[)\]]/g, ' ').replace(/^\s*(?:zrobion|wykonan)[a-z]*\s*[-–—:]?\s*/, '').replace(/[^a-z0-9]+/g, ' ').trim();
}
function matchTermin(firm, p) {
  const cases = S.data.sprawy.filter((s) => s.kancelaria === firm), none = { id: '', conf: '', how: '' };
  if (p.teczka) { const s = cases.find((x) => String(x.numer).toUpperCase() === p.teczka); if (s) return { id: s.id, conf: 'pewne', how: 'nr teczki' }; }
  const ns = (x) => norm(x).replace(/\s+/g, '');
  if (p.sygn) { const s = cases.find((x) => x.sygn_akt && ns(x.sygn_akt) === ns(p.sygn)); if (s) return { id: s.id, conf: 'pewne', how: 'sygnatura' }; }
  const toks = (p.klient ? p.klient.split(/\s+/) : (p.czynnosc.match(/[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]{2,}(?:-[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+)?/g) || [])).filter((w) => w.length >= 3);
  if (!toks.length) return none;
  const split = (ws) => ws.reduce((a, x) => a.concat([x], x.split('-')), []);
  const hits = S.data.klienci.filter((k) => k.kancelaria === firm).map((k) => {
    const words = String(k.nazwa).split(/\s+/).filter(Boolean), parts = split(words), sur = split(words.length > 1 ? words.slice(1) : words);
    return { k, n: toks.filter((t) => parts.some((x) => SH.nameMatch(x, t))).length, sur: toks.some((t) => sur.some((x) => SH.nameMatch(x, t))) };
  }).filter((x) => x.n);
  if (!hits.length) return none;
  const best = Math.max(...hits.map((x) => x.n)), top = hits.filter((x) => x.n === best);
  const cand = cases.filter((s) => top.some((x) => x.k.id === s.klient_id));
  if (!cand.length) return { id: '', conf: '', how: 'klient bez sprawy' };
  const pool = cand.filter(isOpenCase).length ? cand.filter(isOpenCase) : cand;
  /* „Pewne” tylko po nazwisku albo imieniu i nazwisku; samo imię to najwyżej „prawdopodobne”. */
  if (pool.length === 1 && top.length === 1 && (best >= 2 || top[0].sur)) return { id: pool[0].id, conf: 'pewne', how: 'klient' };
  const words = norm(p.czynnosc).split(/[^a-z0-9]+/).filter((w) => w.length > 4);
  const scored = pool.map((s) => ({ s, sc: words.filter((w) => norm(s.tytul + ' ' + s.kategoria).indexOf(w.slice(0, 5)) >= 0).length })).sort((a, b) => b.sc - a.sc);
  return { id: scored[0].s.id, conf: 'prawdopodobne', how: 'klient, ' + pool.length + ' spraw' };
}
function calBuildRows() {
  const st = IMP.cal, names = (S.boot.team || []).map((m) => m.imie_nazwisko), byKey = {};
  st.events.forEach((e) => {
    if (!(e.allDay || e.hours >= 23) || e.recurring) return;
    const p = SH.parseTermin(e.title, names), key = e.date + '|' + calDedupKey(e.title);
    const prev = byKey[key];
    if (prev) { prev.p.done = prev.p.done || p.done; prev.dups++; if (e.uid) prev.uids.push(e.uid); return; }
    byKey[key] = { e, p, dups: 0, uids: e.uid ? [e.uid] : [] };
  });
  st.rows = Object.values(byKey).map((x) => {
    const p = x.p, m = p.isTermin ? matchTermin(st.firm, p) : { id: '', conf: '', how: '' };
    const s = byId('sprawy', st.firm, m.id), pr = p.prawnik ? (S.boot.team || []).find((t) => t.imie_nazwisko === p.prawnik) : null;
    const status = p.cancel ? 'Nieaktualny' : p.done ? 'Wykonany' : x.e.date < today() ? 'Do weryfikacji' : 'Otwarty';
    return { e: x.e, p, dups: x.dups, uids: x.uids.sort(), inc: p.isTermin, sprawa_id: m.id, conf: m.conf, how: m.how, status,
      odp: calOdp(st.firm, s && s.prowadzacy, pr && pr.email) };
  }).sort((a, b) => (a.e.date < b.e.date ? 1 : -1));
}

function calReadFile(file) {
  const r = new FileReader();
  r.onload = () => {
    const from = ($('#cal-from') || {}).value || '';
    /* Zawijanie linii w .ics jest co 75 bajtów i potrafi rozciąć polską literę — łączymy linie przed dekodowaniem UTF-8. */
    const b = new Uint8Array(r.result), out = new Uint8Array(b.length);
    let n = 0;
    for (let i = 0; i < b.length; i++) {
      if (b[i] === 13 && b[i + 1] === 10 && (b[i + 2] === 32 || b[i + 2] === 9)) { i += 2; continue; }
      if (b[i] === 10 && (b[i + 1] === 32 || b[i + 1] === 9)) { i += 1; continue; }
      out[n++] = b[i];
    }
    const evs = SH.parseIcs(new TextDecoder('utf-8').decode(out.subarray(0, n))).filter((e) => (e.allDay || e.hours >= 23) && (!from || e.date >= from));
    calSetEvents('Plik ' + file.name, evs);
    toast('Wczytano ' + evs.length + ' wydarzeń całodniowych i 24-godzinnych');
  };
  r.onerror = () => toast('Nie udało się odczytać pliku.', true);
  r.readAsArrayBuffer(file);
}

document.addEventListener('click', (e) => {
  if (e.target.closest('a[target="_blank"], a[href^="mailto:"], a[href^="tel:"], a[target="_top"]')) return;
  const pick = e.target.closest('[data-pick]');
  if (pick) {
    const box = pick.closest('.combo'), firm = box.dataset.firm || (S.form ? S.form.firm : defaultFirm());
    const id = pick.dataset.pick, r = id ? byId(box.dataset.ref, firm, id) : null;
    $('input[type=hidden]', box).value = id;
    if (r) $('.combo-q', box).value = refLabel(box.dataset.ref, r);
    $('.combo-list', box).hidden = true;
    if (box.dataset.impcal !== undefined && IMP.cal) { const row = IMP.cal.rows[+box.dataset.impcal]; row.sprawa_id = id; row.conf = id ? 'ręcznie' : ''; const s = byId('sprawy', firm, id); row.odp = calOdp(firm, s && s.prowadzacy, row.odp); render(); }
    return;
  }
  const el = e.target.closest('[data-act],[data-go],[data-sort],[data-filt-set],[data-scope],[data-tab]');
  if (!e.target.closest('.search')) { const r = $('.search-res'); if (r) r.hidden = true; }
  if (!el) return;
  if (el.dataset.act && ACTIONS[el.dataset.act]) { e.preventDefault(); ACTIONS[el.dataset.act](el); if (!el.dataset.go) return; }
  if (el.dataset.go !== undefined) {
    e.preventDefault();
    const g = el.dataset.go;
    if (!g) return;
    if ($('.search-res')) $('.search-res').hidden = true;
    if (g.indexOf('edit/') === 0) { const [, t, key] = g.split('/'); const [firm, id] = key.split(':'); const r = byId(t, firm, id); if (r) openForm(t, r); return; }
    if (g.indexOf('team/') === 0) { teamModal((S.boot.team || []).find((m) => m.email === g.slice(5))); return; }
    if (g.indexOf('zadanie/') === 0) { const [, f, id] = g.split('/'); openTaskModal(f, id); return; }
    if (g.indexOf('zad-osoba/') === 0) { setFilt('zad', 'tab', 'wszystkie'); setFilt('zad', 'who', g.slice(10)); render(); return; }
    if ($('#q')) $('#q').value = '';
    closeModal();
    go(g);
    return;
  }
  if (el.dataset.sort && !el.classList.contains('nosort')) {
    const id = el.dataset.tid, cur = S.sort[id];
    S.sort[id] = { k: el.dataset.sort, dir: cur && cur.k === el.dataset.sort && cur.dir === 'asc' ? 'desc' : 'asc' };
    render(); return;
  }
  if (el.dataset.filtSet) { setFilt(el.dataset.filtSet, el.dataset.key, el.dataset.val); render(); return; }
  if (el.dataset.scope) { S.firm = el.dataset.scope; try { localStorage.setItem('crm.firm', S.firm); } catch (x) { /* — */ } render(); return; }
  if (el.dataset.tab) { S.tab[el.dataset.tkey] = el.dataset.tab; render(); }
});

    fieldsOf(S.form.table).forEach((fd) => { if (fd.t === 'ref' || fd.t === 'user' || fd.t === 'users') S.form.values[fd.k] = ''; });
    S.form.firm = el.value;
    Object.assign(S.form.values, Object.fromEntries(Object.entries(defaultsFor(S.form.table, el.value)).filter(([k]) => !S.form.values[k] || ['opiekun', 'prowadzacy', 'odpowiedzialny', 'osoba', 'status', 'stawka'].indexOf(k) >= 0)));
    $('.scrim').innerHTML = formHtml(S.form);
    return;
  }
  if (el.dataset.actChange === 'zap-status-sel') { zapUpdate({ status: el.value }, el); return; }
  if (el.name === 'przypisane' && S.form && S.form.table === 'zadania') { const cb = $('#f-sprawdzenie'); if (cb && !cb.disabled) cb.checked = defaultReview(el.value) === 'tak'; return; }
  if (el.id === 'cal-id' || el.id === 'cal-from') { IMP.cal = Object.assign(IMP.cal || {}, el.id === 'cal-id' ? { calId: el.value.trim() } : { from: el.value }); return; }
  if (el.id === 'cal-file' && el.files && el.files[0]) { calReadFile(el.files[0]); return; }
  if (el.dataset.cal !== undefined && IMP.cal) {
    const k = el.dataset.cal, i = el.dataset.i;
    if (k === 'firm') { IMP.cal.firm = el.value; IMP.cal.rows = null; }
    else if (k === 'tasks') IMP.cal.tasks = el.checked;
    else if (k === 'show') IMP.cal.show = el.value;
    else if (k === 'inc') IMP.cal.rows[+i].inc = el.checked;
    else if (k === 'st') IMP.cal.rows[+i].status = el.value;
    else if (k === 'odp') IMP.cal.rows[+i].odp = el.value;
    render(); return;
  }
  if (el.id === 'c-preset') { const p = PRESETS[+el.value]; if (p && p[2]) { $('#c-n').value = p[2]; $('#c-u').value = p[3]; } calcUpdate(); return; }
  if (el.id === 'c-u' || el.id === 'c-start') { calcUpdate(); return; }
  if (el.dataset.imp) {
    const st = IMP[el.dataset.imp], map = el.dataset.map, k = el.dataset.k;
    if (map === 'opFirm') st.op[k].firm = el.value;
    else if (map === 'opUser') st.op[k].user = el.value;
    else if (map === 'colors') st.colors[k] = el.value;
    else if (map === 'stat') st.stat[k] = el.value;
    else if (map === 'firm') st.firm = el.value;
    else if (map === 'byClient') st.byClient = el.checked;
    render();
  }
});
document.addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target, btn = e.submitter || f.querySelector('[type=submit]');
  if (f.id === 'frm') { submitForm(btn); return; }
  if (f.id === 'acc-form') {
    const [, firm, id] = S.route.split('/');
    const d = Object.fromEntries(new FormData(f).entries());
    d.folder = !!f.elements.folder.checked;
    await busy(btn, async () => {
      const r = await call('apiAccept', firm, id, d);
      if (r.klient) upsert('klienci', r.klient);
      upsert('sprawy', r.sprawa); upsert('zapytania', r.zapytanie);
      closeModal(); toast('Założono sprawę ' + caseNo(r.sprawa)); go('sprawa/' + firm + '/' + r.sprawa.id);
    });
    return;
  }
  if (f.id === 'zclose-form') { await zapUpdate({ status: f.elements.status.value, powod: f.elements.powod.value }, btn); closeModal(); return; }
  if (f.id === 'team-form') {
    const d = { email: f.elements.email.value, imie_nazwisko: f.elements.imie_nazwisko.value, tytul: f.elements.tytul.value, telefon: f.elements.telefon.value, rola: f.elements.rola.value,
      stanowisko: f.elements.stanowisko.value, aliasy: f.elements.aliasy.value, powiadomienia: f.elements.powiadomienia.checked ? 'tak' : 'nie',
      kancelarie: $$('input[name=k]:checked', f).map((x) => x.value).join(','), aktywny: f.elements.aktywny.checked ? 'tak' : 'nie' };
    await busy(btn, async () => { const r = await call('apiTeamSave', d); closeModal(); await reload(true); shareReport([{ email: d.email, log: r.shareLog }]); });
    return;
  }
  if (f.id === 'firm-form') {
    const d = Object.fromEntries(new FormData(f).entries()); d.kod = f.dataset.firm;
    await busy(btn, async () => { await call('apiFirmSave', d); closeModal(); await reload(true); toast('Zapisano dane kancelarii'); });
  }
});
document.addEventListener('keydown', (e) => {
  const inField = /INPUT|TEXTAREA|SELECT/.test((e.target.tagName || ''));
  if (e.key === '/' && !inField && $('#q')) { e.preventDefault(); $('#q').focus(); return; }
  if (e.key === 'Escape') { if ($('.scrim')) closeModal(); else if ($('.search-res')) $('.search-res').hidden = true; return; }
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.qa) { e.preventDefault(); quickSave(e.target); return; }
  if (e.key === 'Enter' && e.target.id === 'q') { const a = $('.search-res a'); if (a) { e.preventDefault(); a.click(); } return; }
  if (e.key === 'Enter' && e.target.classList.contains('combo-q')) { e.preventDefault(); const p = e.target.closest('.combo').querySelector('[data-pick]'); if (p) p.click(); }
});

function afterRender() {
  if ($('#calc')) calcUpdate();
  const [view, firm, id] = S.route.split('/');
  const tabKey = { sprawa: 'sp', klient: 'kl', zapytanie: 'zap' }[view];
  if (tabKey && S.tab[tabKey + ':' + firm + ':' + id] === 'mail') {
    const key = { sp: 's', kl: 'k', zap: 'z' }[tabKey] + ':' + firm + ':' + id;
    const btn = $(`[data-act="gmail"][data-key="${key}"]`);
    if (btn && !S.cache.gmail[key]) loadGmail(key, btn.dataset.emails.split(','));
  }
}

/* ---------- Start ---------- */
function applyBoot() {
  S.data = S.boot.data || {};
  ((S.boot.schema && S.boot.schema.order) || []).forEach((t) => { S.data[t] = S.data[t] || []; });
  reindex();
  if (S.firm !== 'all' && myFirms().indexOf(S.firm) < 0) S.firm = 'all';
  if (myFirms().length < 2) S.firm = 'all';
  S.loadedAt = Date.now();
}
async function reload(silent) {
  S.boot = await call('bootstrap');
  S.now = warsawNow();
  applyBoot();
  S.cache.hist = {};
  if (S.boot.state !== 'ok') $('#app').innerHTML = '';
  render();
  if (!silent) toast('Dane odświeżone');
}
async function start() {
  S.now = warsawNow();
  try { S.boot = await call('bootstrap'); } catch (e) {
    $('#app').innerHTML = `<div class="center"><div class="box"><div class="banner">Nie udało się wczytać danych: ${esc(e.message)}</div><button class="btn" onclick="location.reload()">Spróbuj ponownie</button></div></div>`;
    return;
  }
  applyBoot();
  const useGas = window.google && google.script && google.script.url;
  if (useGas) {
    google.script.url.getLocation((loc) => { if (loc.hash) S.route = loc.hash; render(); });
    if (google.script.history) google.script.history.setChangeHandler((ev) => routeFromHash(ev.location.hash));
  } else {
    if (location.hash.length > 1) S.route = decodeURIComponent(location.hash.slice(1));
    window.addEventListener('popstate', () => routeFromHash(decodeURIComponent(location.hash)));
    render();
  }
  /* Co minutę: zegar (24 h robocze, terminy). Po powrocie do karty po >3 min — świeże dane. */
  setInterval(() => {
    S.now = warsawNow();
    const busyUi = $('.scrim') || (document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName));
    if (!busyUi && S.boot.state === 'ok') render();
  }, 60000);
  document.addEventListener('visibilitychange', () => {
    const typing = document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if (document.visibilityState === 'visible' && Date.now() - S.loadedAt > 180000 && !$('.scrim') && !typing && S.boot.state === 'ok') reload(true).catch(() => {});
  });
}
start();
</script>
